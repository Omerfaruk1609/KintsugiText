version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kintsugi_postgres
    restart: always
    environment:
      POSTGRES_USER: kintsugi_user
      POSTGRES_PASSWORD: kintsugi_password
      POSTGRES_DB: kintsugi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kintsugi_redis
    restart: always
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ..
      dockerfile: docker/ai-service.Dockerfile
    container_name: kintsugi_ai_service
    restart: always
    ports:
      - "8000:8000"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: kintsugi_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://kintsugi_user:kintsugi_password@postgres:5432/kintsugi_db
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - ai-service

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: kintsugi_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
